<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .game-container {
      position: relative;
      width: 1140px;
      height: 500px;
      overflow: hidden;
      border: 4px solid #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      background-image: url(/imagecopy.png);
      background-size: contain;
    }

    .game-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .start-button {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: linear-gradient(#ffcc00, #ff8800);
      border: 3px solid #000;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 #aa5500;
      transition: all 0.1s ease;
    }

    .start-button:hover {
      background: linear-gradient(#ffd633, #ff9900);
    }

    .start-button:active {
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 2px 0 #aa5500;
    }
  </style>
</head>
<body>

  <div class="game-container">
   
    <button class="start-button" onclick="startGame()">
      START GAME
    </button>
  </div>

  <script>
    function startGame() {
    
      // You can replace this with:
      window.location.href = "game.html";
    }
  </script>

</body>
</html>
