
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #game-root {
    background: #111;
    min-height: 560px;
    font-family: 'Arial Black', Arial, sans-serif;
    user-select: none;
    overflow: hidden;
    position: relative;
   padding-top: 500px;
  }
  #title-bar {
    text-align: center;
    padding: 10px 0 4px;
    letter-spacing: 4px;
    font-size: 26px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #fff;
    background: #111;
    border-bottom: 3px solid #FFD700;
  }
  #subtitle { font-size: 11px; color: #fff; letter-spacing: 2px; font-weight: 400; margin-top: 2px; }
  #canvas-wrap { position: relative; width: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; cursor: crosshair; touch-action: none;height:580px; }
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    background: #111; border-top: 2px solid #FFD700; padding: 7px 18px;
  }
  .hud-label { color: #FFD700; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
  .hud-val { color: #fff; font-size: 20px; font-weight: 900; }
  #msg-overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.88);
    border: 3px solid #FFD700; border-radius: 12px;
    color: #FFD700; font-size: 22px; font-weight: 900;
    padding: 28px 44px; text-align: center;
    display: none; z-index: 99; letter-spacing: 2px; pointer-events: none;
  }
  #msg-overlay .sub { color: #fff; font-size: 14px; margin-top: 8px; letter-spacing: 1px; }
  #restart-btn {
    margin-top: 14px; background: #FFD700; color: #111;
    border: none; border-radius: 6px; font-size: 15px; font-weight: 900;
    padding: 9px 28px; cursor: pointer; letter-spacing: 1px;
    pointer-events: all; display: block; width: 100%;
  }
  #restart-btn:hover { background: #fff; }
  #aim-hint {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,215,0,0.55);
    font-size: 11px; font-weight: 900; letter-spacing: 2px; pointer-events: none;
  }
</style>

<div id="game-root">
  <div id="title-bar">ANGRY MOAI<br><span id="subtitle">🗿  ISLE OF RAGE  🗿</span></div>
  <div id="canvas-wrap">
    <canvas id="gc"></canvas>
    <div id="msg-overlay">
      <div id="msg-title">LEVEL CLEAR!</div>
      <div class="sub" id="msg-sub">All pigs destroyed!</div>
      <button id="restart-btn" onclick="initGame()">PLAY AGAIN</button>
    </div>
    <div id="aim-hint">DRAG THE MOAI TO AIM — PULL FURTHER FOR MORE POWER</div>
  </div>
  <div id="hud">
    <div><div class="hud-label">SCORE</div><div class="hud-val" id="score-val">0</div></div>
    <div style="text-align:center"><div class="hud-label">MOAIS LEFT</div><div class="hud-val" id="moai-val">3</div></div>
    <div style="text-align:right"><div class="hud-label">PIGS LEFT</div><div class="hud-val" id="pig-val">3</div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const msgOverlay = document.getElementById('msg-overlay');
const msgTitle = document.getElementById('msg-title');
const msgSub = document.getElementById('msg-sub');

const W = 680, H = 420;
canvas.width = W; canvas.height = H;

const GRAVITY = 0.32;
const GROUND = H - 52;
const SLING_X = 90, SLING_Y = GROUND - 65;
const PULL_LIMIT = 100;
const POWER = 0.26;

let moais, pigs, blocks, particles, score, dragging, dragX, dragY, gameOver, won;
let moaiVX=0, moaiVY=0, moaiX=SLING_X, moaiY=SLING_Y, moaiActive=false;
let curMoaiIdx=0, shotCooldown=0;

function rnd(a,b){ return a+Math.random()*(b-a); }

function initGame(){
  gameOver=false; won=false; score=0;
  moaiActive=false; dragging=false;
  moaiVX=0; moaiVY=0; moaiX=SLING_X; moaiY=SLING_Y;
  curMoaiIdx=0; shotCooldown=0; particles=[];
  msgOverlay.style.display='none';

  moais = [{active:true},{active:true},{active:true}];

  blocks = [
    {x:400, y:GROUND-60, w:16, h:60, hp:2, col:'#888'},
    {x:480, y:GROUND-60, w:16, h:60, hp:2, col:'#888'},
    {x:398, y:GROUND-78, w:100, h:18, hp:2, col:'#aaa'},
    {x:545, y:GROUND-60, w:16, h:60, hp:2, col:'#888'},
    {x:625, y:GROUND-60, w:16, h:60, hp:2, col:'#888'},
    {x:543, y:GROUND-78, w:100, h:18, hp:2, col:'#aaa'},
    {x:447, y:GROUND-105, w:14, h:44, hp:2, col:'#999'},
    {x:567, y:GROUND-105, w:14, h:44, hp:2, col:'#999'},
    {x:445, y:GROUND-108, w:150, h:14, hp:2, col:'#bbb'},
  ];

  pigs = [
    {x:440, y:GROUND-96, r:19, alive:true, dying:0},
    {x:510, y:GROUND-96, r:19, alive:true, dying:0},
    {x:582, y:GROUND-96, r:19, alive:true, dying:0},
  ];

  updateHUD();
  loop();
}

let animId;
function loop(){
  cancelAnimationFrame(animId);
  update(); draw();
  if(!gameOver) animId = requestAnimationFrame(loop);
  else showEnd();
}

function update(){
  shotCooldown = Math.max(0, shotCooldown-1);
  if(moaiActive){
    moaiVY += GRAVITY;
    moaiX += moaiVX;
    moaiY += moaiVY;
    checkCollisions();
    if(moaiY > GROUND+80 || moaiX > W+80 || moaiX < -80){
      moaiActive=false; nextMoai();
    }
  }
  for(let b of blocks){
    if(b.crumble>0){ b.crumble--; if(b.crumble<=0) b.gone=true; }
  }
  // Dying pigs: shrink and vanish
  for(let p of pigs){
    if(p.dying>0){ p.dying--; if(p.dying<=0) p.alive=false; }
  }
  particles = particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--;
    return p.life>0;
  });
  if(pigs.filter(p=>p.alive).length===0 && !gameOver){ gameOver=true; won=true; }
  if(moais.filter(m=>m.active).length===0 && !moaiActive && pigs.filter(p=>p.alive).length>0 && !gameOver){ gameOver=true; won=false; }
  updateHUD();
}

function nextMoai(){ curMoaiIdx++; }

function checkCollisions(){
  let r=22;
  for(let b of blocks){
    if(b.gone||b.crumble) continue;
    if(moaiX+r>b.x && moaiX-r<b.x+b.w && moaiY+r>b.y && moaiY-r<b.y+b.h){
      b.hp--;
      spawnParticles(moaiX,moaiY,'#aaa',8);
      if(b.hp<=0){ b.crumble=10; score+=50; }
      let overlapL=moaiX+r-b.x, overlapR=b.x+b.w-(moaiX-r);
      let overlapT=moaiY+r-b.y, overlapB=b.y+b.h-(moaiY-r);
      if(Math.min(overlapL,overlapR)<Math.min(overlapT,overlapB)) moaiVX*=-0.45;
      else moaiVY*=-0.45;
      moaiVX*=0.8; moaiVY*=0.8;
      if(Math.abs(moaiVX)+Math.abs(moaiVY)<1.5){ moaiActive=false; nextMoai(); }
    }
  }
  for(let p of pigs){
    if(!p.alive||p.dying) continue;
    let dx=moaiX-p.x, dy=moaiY-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<r+p.r){
      // ONE HIT KILL — instant dying animation
      p.dying=14;
      score+=200;
      spawnParticles(p.x,p.y,'#5a3',28);
      spawnParticles(p.x,p.y,'#FFD700',10);
      moaiVX*=0.5; moaiVY*=0.5;
    }
  }
  if(moaiY+r>=GROUND){
    moaiY=GROUND-r;
    moaiVY*=-0.28; moaiVX*=0.72;
    spawnParticles(moaiX,GROUND,'#FFD700',6);
    if(Math.abs(moaiVY)<1.2){ moaiActive=false; nextMoai(); }
  }
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-5,5),vy:rnd(-6,0.5),col,life:rnd(20,38)|0,r:rnd(2,5.5)});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawSky(); drawGround(); drawPowerMeter(); drawSlingshot();
  drawBlocks(); drawPigs(); drawParticles();
  drawTrajectoryDots(); drawMoaiBullet(); drawQueueMoais();
}

function drawSky(){
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='#FFD700';
  for(let i=0;i<22;i++){
    ctx.beginPath(); ctx.arc((i*71+13)%W,(i*53+22)%(GROUND-40),1.2,0,Math.PI*2); ctx.fill();
  }
}

function drawGround(){
  ctx.fillStyle='#FFD700'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#111'; ctx.fillRect(0,GROUND,W,3);
  ctx.fillStyle='#c9a800';
  for(let i=0;i<W;i+=38) ctx.fillRect(i,GROUND+4,20,6);
}

function getPullFraction(){
  if(!dragging) return 0;
  let dx=dragX-SLING_X, dy=dragY-SLING_Y;
  return Math.min(1,Math.sqrt(dx*dx+dy*dy)/PULL_LIMIT);
}

function drawPowerMeter(){
  if(!dragging) return;
  let frac=getPullFraction();
  let bw=80,bh=10,bx=SLING_X-40,by=SLING_Y-90;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(bx-2,by-2,bw+4,bh+4,4); ctx.fill();
  ctx.fillStyle=frac<0.4?'#5f5':frac>0.75?'#f55':'#FFD700';
  ctx.beginPath(); ctx.roundRect(bx,by,bw*frac,bh,3); ctx.fill();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,3); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 9px Arial';
  ctx.textAlign='center'; ctx.fillText('POWER',bx+bw/2,by-4); ctx.textAlign='left';
}

function drawSlingshot(){
  ctx.save();
  ctx.strokeStyle='#8B5E3C'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(SLING_X-12,SLING_Y+14); ctx.lineTo(SLING_X-16,SLING_Y-36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(SLING_X+12,SLING_Y+14); ctx.lineTo(SLING_X+16,SLING_Y-36); ctx.stroke();
  ctx.strokeStyle='#4a2e0f'; ctx.lineWidth=9;
  ctx.beginPath(); ctx.moveTo(SLING_X-10,SLING_Y+16); ctx.lineTo(SLING_X,SLING_Y+28); ctx.lineTo(SLING_X+10,SLING_Y+16); ctx.stroke();
  if(dragging){
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(SLING_X-14,SLING_Y-32); ctx.lineTo(dragX,dragY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SLING_X+14,SLING_Y-32); ctx.lineTo(dragX,dragY); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle='rgba(255,215,0,0.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(SLING_X-14,SLING_Y-32); ctx.lineTo(SLING_X,SLING_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SLING_X+14,SLING_Y-32); ctx.lineTo(SLING_X,SLING_Y); ctx.stroke();
  }
  ctx.restore();
}

function drawTrajectoryDots(){
  if(!dragging) return;
  let dx=SLING_X-dragX, dy=SLING_Y-dragY;
  let spd=Math.sqrt(dx*dx+dy*dy);
  let vx=dx*POWER, vy=dy*POWER-spd*0.012;
  let tx=SLING_X, ty=SLING_Y;
  for(let i=0;i<28;i++){
    vy+=GRAVITY; tx+=vx; ty+=vy;
    if(i%2===0){
      ctx.globalAlpha=1-(i/28)*0.7;
      ctx.fillStyle='#FFD700';
      ctx.beginPath(); ctx.arc(tx,ty,3,0,Math.PI*2); ctx.fill();
    }
    if(ty>GROUND) break;
  }
  ctx.globalAlpha=1;
}

function drawMoaiBullet(){
  let mx,my,angle=0;
  if(moaiActive){ mx=moaiX; my=moaiY; angle=Math.atan2(moaiVY,moaiVX); }
  else if(dragging){ mx=dragX; my=dragY; }
  else { mx=SLING_X; my=SLING_Y; }
  drawMoaiAt(ctx,mx,my,22,angle);
}

function drawQueueMoais(){
  let qi=0;
  for(let i=0;i<moais.length;i++){
    if(!moais[i].active) continue;
    if(i===curMoaiIdx){
      if(!moaiActive&&!dragging) drawMoaiAt(ctx,SLING_X,SLING_Y,22,0);
    } else {
      drawMoaiAt(ctx,SLING_X-50-qi*46,SLING_Y+10,16,0); qi++;
    }
  }
}

function drawMoaiAt(c,x,y,r,angle){
  c.save(); c.translate(x,y); c.rotate(angle*0.12);
  let h=r*2.5,w=r*1.5;
  c.fillStyle='#e8e0d0'; c.strokeStyle='#222'; c.lineWidth=1.5;
  c.beginPath(); c.roundRect(-w/2,-h*0.55,w,h,[r*0.3,r*0.3,r*0.18,r*0.18]);
  c.fill(); c.stroke();
  c.fillStyle='#d0c8ba'; c.fillRect(-w/2+2,-h*0.06,w-4,h*0.38);
  c.fillStyle='#c0b8ae'; c.fillRect(-w/2+4,h*0.02,w-8,h*0.28);
  let ey=-h*0.18;
  c.fillStyle='#222';
  c.beginPath(); c.ellipse(-w*0.24,ey,r*0.23,r*0.16,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(w*0.24,ey,r*0.23,r*0.16,0,0,Math.PI*2); c.fill();
  c.strokeStyle='#222'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(-w*0.34,ey-r*0.22); c.lineTo(-w*0.12,ey-r*0.08); c.stroke();
  c.beginPath(); c.moveTo(w*0.34,ey-r*0.22); c.lineTo(w*0.12,ey-r*0.08); c.stroke();
  c.strokeStyle='#555'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(-w*0.2,ey+r*0.34); c.quadraticCurveTo(0,ey+r*0.2,w*0.2,ey+r*0.34); c.stroke();
  c.fillStyle='#c8c0b0'; c.fillRect(-w*0.14,-h*0.55,w*0.28,r*0.3);
  c.restore();
}

function drawBlocks(){
  for(let b of blocks){
    if(b.gone) continue;
    ctx.globalAlpha=b.crumble?(b.crumble/10):1;
    ctx.fillStyle=b.hp<=1?'#666':b.col;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=1;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    if(b.hp<=1){
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(b.x+4,b.y+4); ctx.lineTo(b.x+b.w-4,b.y+b.h-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x+b.w-4,b.y+4); ctx.lineTo(b.x+4,b.y+b.h-4); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

function drawPigs(){
  for(let p of pigs){
    if(!p.alive) continue;
    // Scale down as dying progresses
    let scale = p.dying>0 ? (p.dying/14) : 1;
    let alpha = p.dying>0 ? (p.dying/14) : 1;
    ctx.globalAlpha=alpha;
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(scale,scale);
    ctx.fillStyle='#5ab82e'; ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#7fd44e';
    ctx.beginPath(); ctx.arc(-p.r*0.2,-p.r*0.15,p.r*0.35,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(-p.r*0.32,-p.r*0.18,p.r*0.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.r*0.32,-p.r*0.18,p.r*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-p.r*0.26,-p.r*0.22,p.r*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.r*0.38,-p.r*0.22,p.r*0.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2d5e10';
    ctx.beginPath(); ctx.arc(0,p.r*0.12,p.r*0.28,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.arc(0,p.r*0.12,p.r*0.28,0,Math.PI*2); ctx.stroke();
    // Always show smile (alive until fully gone)
    ctx.strokeStyle='#111'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(0,p.r*0.45,p.r*0.28,0.1,Math.PI-0.1); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=1;
  }
}

function drawParticles(){
  for(let p of particles){
    ctx.globalAlpha=p.life/36;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('moai-val').textContent=moais.filter(m=>m.active).length+(moaiActive?1:0);
  document.getElementById('pig-val').textContent=pigs.filter(p=>p.alive).length;
}

function showEnd(){
  msgOverlay.style.display='block';
  msgTitle.textContent=won?'LEVEL CLEAR!':'GAME OVER!';
  msgSub.textContent=won?`Score: ${score} pts — All pigs destroyed!`:`The pigs survived! Score: ${score}`;
  msgOverlay.querySelector('button').style.pointerEvents='all';
}

function getCanvasPos(e){
  let rect=canvas.getBoundingClientRect();
  let sx=W/rect.width, sy=H/rect.height;
  if(e.touches) return {x:(e.touches[0].clientX-rect.left)*sx, y:(e.touches[0].clientY-rect.top)*sy};
  return {x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy};
}

function onDown(e){
  e.preventDefault();
  if(gameOver||moaiActive||shotCooldown>0) return;
  let {x,y}=getCanvasPos(e);
  if(Math.sqrt((x-SLING_X)**2+(y-SLING_Y)**2)<52){
    dragging=true; dragX=SLING_X; dragY=SLING_Y;
  }
}

function onMove(e){
  e.preventDefault();
  if(!dragging) return;
  let {x,y}=getCanvasPos(e);
  let dx=x-SLING_X, dy=y-SLING_Y;
  let d=Math.sqrt(dx*dx+dy*dy);
  if(d>PULL_LIMIT){ let f=PULL_LIMIT/d; dx*=f; dy*=f; }
  dragX=SLING_X+dx; dragY=SLING_Y+dy;
}

function onUp(e){
  e.preventDefault();
  if(!dragging) return;
  dragging=false;
  let dx=SLING_X-dragX, dy=SLING_Y-dragY;
  let spd=Math.sqrt(dx*dx+dy*dy);
  if(spd<10){ moaiX=SLING_X; moaiY=SLING_Y; return; }
  moaiX=dragX; moaiY=dragY;
  moaiVX=dx*POWER; moaiVY=dy*POWER-spd*0.014;
  moaiActive=true;
  if(moais[curMoaiIdx]) moais[curMoaiIdx].active=false;
  shotCooldown=45;
}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});

initGame();
</script>
