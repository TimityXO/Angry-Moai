<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANGRY MOAI — LEVEL 2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#111;height:100%;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #gr{background:#111;font-family:'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden;position:relative;width:100%;max-width:720px;}
  #tb{text-align:center;padding:clamp(5px,2vw,12px) 0 3px;letter-spacing:clamp(2px,1vw,5px);font-size:clamp(14px,3.5vw,24px);font-weight:900;color:#FF4400;text-shadow:2px 2px 0 #000,-1px -1px 0 #FFD700;background:#111;border-bottom:3px solid #FF4400;line-height:1.3;}
  #sb{font-size:clamp(7px,1.6vw,11px);color:#FFD700;letter-spacing:clamp(1px,0.4vw,2px);font-weight:400;margin-top:2px;}
  #lvlbadge{display:inline-block;background:#FF4400;color:#fff;font-size:clamp(8px,1.8vw,12px);padding:2px 10px;border-radius:4px;letter-spacing:2px;margin-left:8px;vertical-align:middle;}
  #cw{position:relative;width:100%;overflow:hidden;}
  canvas{display:block;width:100%;touch-action:none;cursor:crosshair;}
  #hud{display:flex;align-items:center;justify-content:space-between;background:#111;border-top:2px solid #FF4400;padding:clamp(4px,1.5vw,9px) clamp(10px,3vw,22px);}
  .hl{color:#FF4400;font-size:clamp(8px,2vw,13px);font-weight:900;letter-spacing:1px;}
  .hv{color:#fff;font-size:clamp(14px,4vw,22px);font-weight:900;}
  #mo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.92);border:3px solid #FF4400;border-radius:12px;color:#FF4400;font-weight:900;font-size:clamp(14px,4vw,22px);padding:clamp(16px,4vw,30px) clamp(20px,6vw,46px);text-align:center;display:none;z-index:99;letter-spacing:2px;pointer-events:none;width:clamp(230px,74vw,440px);}
  #mo .sub{color:#fff;font-size:clamp(10px,2.5vw,14px);margin-top:8px;letter-spacing:1px;}
  .obtn{margin-top:11px;border:none;border-radius:6px;font-size:clamp(11px,2.8vw,15px);font-weight:900;padding:clamp(7px,2vw,10px) clamp(14px,3.5vw,26px);cursor:pointer;letter-spacing:1px;pointer-events:all;display:block;width:100%;}
  #rb{background:#FF4400;color:#fff;}
  #rb:active{background:#c93200;}
  #nb{background:#FFD700;color:#111;display:none;}
  #nb:active{background:#fff;}
  #backbtn{background:transparent;color:#FFD700;border:1.5px solid #FFD700;display:block;}
  #backbtn:active{background:#FFD700;color:#111;}
  #ah{position:absolute;bottom:clamp(4px,1.2vw,10px);left:50%;transform:translateX(-50%);color:rgba(255,68,0,0.5);font-size:clamp(7px,1.4vw,11px);font-weight:900;letter-spacing:1px;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="gr">
  <div id="tb">ANGRY MOAI <span id="lvlbadge">LEVEL 2</span><br><span id="sb">🗿🗿 THE FORTRESS OF OINK 🗿🗿</span></div>
  <div id="cw">
    <canvas id="gc"></canvas>
    <div id="mo">
      <div id="mt">FORTRESS CLEARED!</div>
      <div class="sub" id="ms"></div>
      <button id="rb" class="obtn" onclick="initGame()">TRY AGAIN</button>
      <button id="nb" class="obtn" onclick="window.location.href='game3.html'">🗿 NEXT LEVEL →</button>
      <button id="backbtn" class="obtn" onclick="window.location.href='game.html'">← BACK TO LEVEL 1</button>
    </div>
    <div id="ah">DRAG MOAI TO AIM · 6 MOAIS · 6 PIGS</div>
  </div>
  <div id="hud">
    <div><div class="hl">BAGS</div><div class="hv" id="sv">0</div></div>
    <div style="text-align:center"><div class="hl">MOAIS</div><div class="hv" id="mv">6</div></div>
    <div style="text-align:right"><div class="hl">PIGS</div><div class="hv" id="pv">6</div></div>
  </div>
</div>

<script>
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const mo=document.getElementById('mo'),mt=document.getElementById('mt'),ms=document.getElementById('ms');
const LW=680,LH=430;
canvas.width=LW;canvas.height=LH;
const GRAV=0.32,GND=LH-52,SX=88,SY=GND-65,PLIM=100,POW=0.26;
let moais,pigs,blocks,parts,score,drag,dX,dY,over,won;
let mVX=0,mVY=0,mX=SX,mY=SY,mA=false,mLeft=0,cool=0,animId;

function rnd(a,b){return a+Math.random()*(b-a);}

function initGame(){
  over=false;won=false;score=0;mA=false;drag=false;
  mVX=0;mVY=0;mX=SX;mY=SY;cool=0;parts=[];
  mo.style.display='none';
  mLeft=6;

  // Dense multi-layer fortress with thick walls and platforms
  blocks=[
    // === LEFT TOWER (thick) ===
    {x:330,y:GND-70,w:20,h:70,hp:3,c:'#777'}, // left pillar
    {x:390,y:GND-70,w:20,h:70,hp:3,c:'#777'}, // right of left tower
    {x:328,y:GND-88,w:84,h:20,hp:3,c:'#999'}, // top slab
    // inner wall left tower
    {x:350,y:GND-68,w:38,h:50,hp:2,c:'#666'},

    // === CENTER TOWER (tall) ===
    {x:455,y:GND-120,w:20,h:120,hp:3,c:'#777'},
    {x:515,y:GND-120,w:20,h:120,hp:3,c:'#777'},
    {x:453,y:GND-138,w:84,h:20,hp:3,c:'#999'}, // roof
    {x:453,y:GND-75,w:84,h:14,hp:2,c:'#aaa'},  // mid floor

    // === RIGHT TOWER ===
    {x:590,y:GND-70,w:20,h:70,hp:3,c:'#777'},
    {x:645,y:GND-70,w:20,h:70,hp:3,c:'#777'},
    {x:588,y:GND-88,w:80,h:20,hp:3,c:'#999'},
    {x:608,y:GND-68,w:35,h:50,hp:2,c:'#666'},

    // === CONNECTING BRIDGE high up ===
    {x:408,y:GND-138,w:48,h:14,hp:2,c:'#aaa'},  // left bridge
    {x:535,y:GND-138,w:56,h:14,hp:2,c:'#aaa'},  // right bridge

    // === GROUND BARRIERS ===
    {x:410,y:GND-30,w:140,h:30,hp:2,c:'#555'},
    {x:555,y:GND-30,w:60,h:30,hp:2,c:'#555'},
  ];

  // 6 pigs — spread across towers at different heights
  pigs=[
    // ground level inside fortress
    {x:370,y:GND-88,r:17,alive:true,dy:0},       // atop left tower slab
    {x:495,y:GND-155,r:17,alive:true,dy:0},       // atop center tower
    {x:535,y:GND-155,r:17,alive:true,dy:0},       // atop center tower right
    {x:625,y:GND-88,r:17,alive:true,dy:0},        // atop right tower slab
    // mid-level (on the mid floor of center tower)
    {x:495,y:GND-90,r:17,alive:true,dy:0},
    // ground level between towers
    {x:480,y:GND-47,r:17,alive:true,dy:0},
  ];

  hud();cancelAnimationFrame(animId);loop();
}

function loop(){upd();draw();if(!over)animId=requestAnimationFrame(loop);else endGame();}

function upd(){
  cool=Math.max(0,cool-1);
  if(mA){
    mVY+=GRAV;mX+=mVX;mY+=mVY;colCheck();
    if(mY>GND+80||mX>LW+80||mX<-80){mA=false;}
  }
  for(let b of blocks){if(b.cr>0){b.cr--;if(b.cr<=0)b.gone=true;}}
  for(let p of pigs){if(p.dy>0){p.dy--;if(p.dy<=0)p.alive=false;}}
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;return p.life>0;});
  if(pigs.filter(p=>p.alive).length===0&&!over){over=true;won=true;}
  if(mLeft===0&&!mA&&pigs.filter(p=>p.alive).length>0&&!over){over=true;won=false;}
  hud();
}

function colCheck(){
  let r=22;
  for(let b of blocks){
    if(b.gone||b.cr)continue;
    if(mX+r>b.x&&mX-r<b.x+b.w&&mY+r>b.y&&mY-r<b.y+b.h){
      b.hp--;sp(mX,mY,'#aaa',8);
      if(b.hp<=0){b.cr=12;score+=50;}
      let mh=Math.min(mX+r-b.x,b.x+b.w-(mX-r)),mv=Math.min(mY+r-b.y,b.y+b.h-(mY-r));
      if(mh<mv)mVX*=-0.45;else mVY*=-0.45;
      mVX*=0.8;mVY*=0.8;
      if(Math.abs(mVX)+Math.abs(mVY)<1.5){mA=false;}
    }
  }
  for(let p of pigs){
    if(!p.alive||p.dy)continue;
    let dx=mX-p.x,dy=mY-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<r+p.r){
      p.dy=14;score+=200;
      sp(p.x,p.y,'#5a3',28);sp(p.x,p.y,'#FF4400',12);sp(p.x,p.y,'#FFD700',8);
      mVX*=0.5;mVY*=0.5;
    }
  }
  if(mY+r>=GND){
    mY=GND-r;mVY*=-0.28;mVX*=0.72;
    sp(mX,GND,'#FF4400',6);
    if(Math.abs(mVY)<1.2){mA=false;}
  }
}

function sp(x,y,c,n){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-5.5,5.5),vy:rnd(-7,0.5),col:c,life:rnd(22,40)|0,r:rnd(2,6)});
}

function draw(){
  ctx.clearRect(0,0,LW,LH);
  drawSky();drawGround();drawPowerMeter();drawSlingshot();
  drawBlocks();drawPigs();drawParticles();drawTrajectory();drawBullet();drawQueue();
}

function drawSky(){
  // Darker reddish sky for level 2
  ctx.fillStyle='#160808';ctx.fillRect(0,0,LW,GND);
  // Stars
  ctx.fillStyle='#FF4400';
  for(let i=0;i<14;i++){ctx.beginPath();ctx.arc((i*83+20)%LW,(i*59+15)%(GND-40),1,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#FFD700';
  for(let i=0;i<10;i++){ctx.beginPath();ctx.arc((i*107+50)%LW,(i*71+30)%(GND-40),1.2,0,Math.PI*2);ctx.fill();}
  // Ominous moon
  ctx.fillStyle='#FF4400';ctx.beginPath();ctx.arc(LW-55,35,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#160808';ctx.beginPath();ctx.arc(LW-47,30,14,0,Math.PI*2);ctx.fill();
  // Background fortress silhouette
  ctx.fillStyle='rgba(40,10,5,0.7)';
  ctx.fillRect(310,GND-160,380,160);
  ctx.fillRect(340,GND-200,80,50);
  ctx.fillRect(555,GND-180,100,30);
  ctx.fillStyle='#160808';
  for(let xi=310;xi<690;xi+=22){ctx.fillRect(xi,GND-162,12,18);}
}

function drawGround(){
  ctx.fillStyle='#8B1A00';ctx.fillRect(0,GND,LW,LH-GND);
  ctx.fillStyle='#111';ctx.fillRect(0,GND,LW,3);
  ctx.fillStyle='#6a1200';
  for(let i=0;i<LW;i+=38)ctx.fillRect(i,GND+4,20,7);
  ctx.fillStyle='#3a0800';
  for(let i=19;i<LW;i+=38)ctx.fillRect(i,GND+8,18,4);
}

function drawPowerMeter(){
  if(!drag)return;
  let dx=dX-SX,dy=dY-SY,fr=Math.min(1,Math.sqrt(dx*dx+dy*dy)/PLIM);
  let bw=80,bh=10,bx=SX-40,by=SY-95;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.roundRect(bx-2,by-2,bw+4,bh+4,4);ctx.fill();
  ctx.fillStyle=fr<0.4?'#5f5':fr>0.75?'#FF4400':'#FFD700';
  ctx.beginPath();ctx.roundRect(bx,by,bw*fr,bh,3);ctx.fill();
  ctx.strokeStyle='#FF4400';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';
  ctx.fillText('POWER',bx+bw/2,by-4);ctx.textAlign='left';
}

function drawSlingshot(){
  ctx.save();
  ctx.strokeStyle='#5C3010';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(SX-12,SY+14);ctx.lineTo(SX-16,SY-36);ctx.stroke();
  ctx.beginPath();ctx.moveTo(SX+12,SY+14);ctx.lineTo(SX+16,SY-36);ctx.stroke();
  ctx.strokeStyle='#2e1800';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(SX-10,SY+16);ctx.lineTo(SX,SY+28);ctx.lineTo(SX+10,SY+16);ctx.stroke();
  if(drag){
    ctx.strokeStyle='#FF4400';ctx.lineWidth=2.5;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(SX-14,SY-32);ctx.lineTo(dX,dY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(SX+14,SY-32);ctx.lineTo(dX,dY);ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle='rgba(255,68,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(SX-14,SY-32);ctx.lineTo(SX,SY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(SX+14,SY-32);ctx.lineTo(SX,SY);ctx.stroke();
  }
  ctx.restore();
}

function drawTrajectory(){
  if(!drag)return;
  let dx=SX-dX,dy=SY-dY,spd=Math.sqrt(dx*dx+dy*dy);
  let vx=dx*POW,vy=dy*POW-spd*0.012,tx=SX,ty=SY;
  for(let i=0;i<28;i++){
    vy+=GRAV;tx+=vx;ty+=vy;
    if(i%2===0){ctx.globalAlpha=1-(i/28)*0.7;ctx.fillStyle='#FF4400';ctx.beginPath();ctx.arc(tx,ty,3,0,Math.PI*2);ctx.fill();}
    if(ty>GND)break;
  }
  ctx.globalAlpha=1;
}

function drawBlocks(){
  for(let b of blocks){
    if(b.gone)continue;
    let fade=b.cr?(b.cr/12):1;
    ctx.globalAlpha=fade;
    // Color by HP
    let col=b.hp>=3?b.c:b.hp===2?'#666':'#444';
    ctx.fillStyle=col;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#FF4400';ctx.lineWidth=1;ctx.strokeRect(b.x,b.y,b.w,b.h);
    // Crack marks when damaged
    if(b.hp<3){
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(b.x+5,b.y+5);ctx.lineTo(b.x+b.w-5,b.y+b.h-5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.x+b.w-5,b.y+5);ctx.lineTo(b.x+5,b.y+b.h-5);ctx.stroke();
    }
    // Stone texture lines
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.5;
    if(b.h>20){ctx.beginPath();ctx.moveTo(b.x,b.y+b.h/2);ctx.lineTo(b.x+b.w,b.y+b.h/2);ctx.stroke();}
    ctx.globalAlpha=1;
  }
}

function drawPigs(){
  for(let p of pigs){
    if(!p.alive)continue;
    let sc=p.dy>0?(p.dy/14):1;
    ctx.globalAlpha=sc;ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);
    // Body
    ctx.fillStyle='#4a9e22';ctx.strokeStyle='#111';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    // Helmet — level 2 pigs wear helmets!
    ctx.fillStyle='#888';
    ctx.beginPath();ctx.arc(0,-p.r*0.3,p.r*0.9,Math.PI,0,false);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#aaa';ctx.fillRect(-p.r*.7,-p.r*.32,p.r*1.4,p.r*.18);
    // Eyes
    ctx.fillStyle='#7fd44e';ctx.beginPath();ctx.arc(-p.r*.2,-p.r*.15,p.r*.35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(-p.r*.28,-p.r*.18,p.r*.16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.r*.28,-p.r*.18,p.r*.16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-p.r*.22,-p.r*.22,p.r*.06,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.r*.34,-p.r*.22,p.r*.06,0,Math.PI*2);ctx.fill();
    // Snout
    ctx.fillStyle='#2d5e10';ctx.beginPath();ctx.arc(0,p.r*.12,p.r*.28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#0a2a05';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(0,p.r*.12,p.r*.28,0,Math.PI*2);ctx.stroke();
    // Grin
    ctx.strokeStyle='#111';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(0,p.r*.44,p.r*.26,.1,Math.PI-.1);ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
}

function drawBullet(){
  if(mA){drawMoai(ctx,mX,mY,22,Math.atan2(mVY,mVX));}
  else if(drag){drawMoai(ctx,dX,dY,22,0);}
  else if(mLeft>0){drawMoai(ctx,SX,SY,22,0);}
}

function drawQueue(){
  let waiting=mLeft-(mA||drag?0:1);
  for(let i=0;i<waiting;i++){drawMoai(ctx,SX-52-i*42,SY+10,15,0);}
}

function drawParticles(){
  for(let p of parts){
    ctx.globalAlpha=p.life/38;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawMoai(c,x,y,r,angle){
  c.save();c.translate(x,y);c.rotate(angle*0.12);
  let h=r*2.5,w=r*1.5;
  c.fillStyle='#e8e0d0';c.strokeStyle='#111';c.lineWidth=1.5;
  c.beginPath();c.roundRect(-w/2,-h*.55,w,h,[r*.3,r*.3,r*.18,r*.18]);c.fill();c.stroke();
  c.fillStyle='#d0c8ba';c.fillRect(-w/2+2,-h*.06,w-4,h*.38);
  c.fillStyle='#c0b8ae';c.fillRect(-w/2+4,h*.02,w-8,h*.28);
  let ey=-h*.18;
  c.fillStyle='#111';
  c.beginPath();c.ellipse(-w*.24,ey,r*.23,r*.16,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(w*.24,ey,r*.23,r*.16,0,0,Math.PI*2);c.fill();
  c.strokeStyle='#111';c.lineWidth=1.4;
  c.beginPath();c.moveTo(-w*.34,ey-r*.22);c.lineTo(-w*.12,ey-r*.08);c.stroke();
  c.beginPath();c.moveTo(w*.34,ey-r*.22);c.lineTo(w*.12,ey-r*.08);c.stroke();
  c.strokeStyle='#444';c.lineWidth=1.2;
  c.beginPath();c.moveTo(-w*.2,ey+r*.34);c.quadraticCurveTo(0,ey+r*.2,w*.2,ey+r*.34);c.stroke();
  c.fillStyle='#c8c0b0';c.fillRect(-w*.14,-h*.55,w*.28,r*.3);
  c.restore();
}

function hud(){
  document.getElementById('sv').textContent=score;
  document.getElementById('mv').textContent=mLeft+(mA?1:0);
  document.getElementById('pv').textContent=pigs.filter(p=>p.alive).length;
}

function endGame(){
  mo.style.display='block';
  if(won){
    mt.textContent='FORTRESS CLEARED!';
    mt.style.color='#FFD700';
    ms.textContent=`EPIC! BAGS: ${score} pts`;
    document.getElementById('nb').style.display='block';
    document.getElementById('nb').style.pointerEvents='all';
  } else {
    mt.textContent='THE PIGS HELD FIRM!';
    mt.style.color='#FF4400';
    ms.textContent=`${pigs.filter(p=>p.alive).length} pig(s) survived. BAGS: ${score}`;
    document.getElementById('nb').style.display='none';
  }
  document.getElementById('rb').style.pointerEvents='all';
  document.getElementById('backbtn').style.pointerEvents='all';
}

function gp(e){
  let rc=canvas.getBoundingClientRect(),sx=LW/rc.width,sy=LH/rc.height;
  if(e.touches)return{x:(e.touches[0].clientX-rc.left)*sx,y:(e.touches[0].clientY-rc.top)*sy};
  return{x:(e.clientX-rc.left)*sx,y:(e.clientY-rc.top)*sy};
}
function onDown(e){
  e.preventDefault();if(over||mA||cool>0||mLeft<=0)return;
  let{x,y}=gp(e);
  if(Math.sqrt((x-SX)**2+(y-SY)**2)<58){drag=true;dX=SX;dY=SY;}
}
function onMove(e){
  e.preventDefault();if(!drag)return;
  let{x,y}=gp(e),dx=x-SX,dy=y-SY,d=Math.sqrt(dx*dx+dy*dy);
  if(d>PLIM){let f=PLIM/d;dx*=f;dy*=f;}
  dX=SX+dx;dY=SY+dy;
}
function onUp(e){
  e.preventDefault();if(!drag)return;drag=false;
  let dx=SX-dX,dy=SY-dY,spd=Math.sqrt(dx*dx+dy*dy);
  if(spd<10){mX=SX;mY=SY;return;}
  if(mLeft<=0)return;
  mLeft--;
  mX=dX;mY=dY;mVX=dx*POW;mVY=dy*POW-spd*0.014;mA=true;cool=45;
}
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});
