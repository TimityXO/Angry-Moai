<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANGRY MOAI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#111;height:100%;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #gr{background:#111;font-family:'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden;position:relative;width:100%;max-width:720px;}
  #tb{text-align:center;padding:clamp(5px,2vw,12px) 0 3px;letter-spacing:clamp(2px,1vw,5px);font-size:clamp(16px,4vw,28px);font-weight:900;color:#FFD700;text-shadow:2px 2px 0 #000,-1px -1px 0 #fff;background:#111;border-bottom:3px solid #FFD700;line-height:1.3;}
  #sb{font-size:clamp(8px,1.8vw,12px);color:#fff;letter-spacing:clamp(1px,0.5vw,3px);font-weight:400;margin-top:2px;}
  #cw{position:relative;width:100%;overflow:hidden;}
  canvas{display:block;width:100%;touch-action:none;cursor:crosshair;}
  #hud{display:flex;align-items:center;justify-content:space-between;background:#111;border-top:2px solid #FFD700;padding:clamp(4px,1.5vw,9px) clamp(10px,3vw,22px);}
  .hl{color:#FFD700;font-size:clamp(8px,2vw,13px);font-weight:900;letter-spacing:1px;}
  .hv{color:#fff;font-size:clamp(14px,4vw,22px);font-weight:900;}
  #mo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.92);border:3px solid #FFD700;border-radius:12px;color:#FFD700;font-weight:900;font-size:clamp(14px,4vw,22px);padding:clamp(16px,4vw,30px) clamp(20px,6vw,46px);text-align:center;display:none;z-index:99;letter-spacing:2px;pointer-events:none;width:clamp(220px,72vw,420px);}
  #mo .sub{color:#fff;font-size:clamp(10px,2.5vw,14px);margin-top:8px;letter-spacing:1px;}
  #rb{margin-top:13px;background:#FFD700;color:#111;border:none;border-radius:6px;font-size:clamp(12px,3vw,16px);font-weight:900;padding:clamp(7px,2vw,10px) clamp(16px,4vw,28px);cursor:pointer;letter-spacing:1px;pointer-events:all;display:block;width:100%;}
  #rb:active{background:#fff;}
  #nb{margin-top:8px;background:#fff;color:#111;border:none;border-radius:6px;font-size:clamp(12px,3vw,16px);font-weight:900;padding:clamp(7px,2vw,10px) clamp(16px,4vw,28px);cursor:pointer;letter-spacing:1px;pointer-events:all;display:none;width:100%;}
  #nb:active{background:#FFD700;}
  #ah{position:absolute;bottom:clamp(4px,1.2vw,10px);left:50%;transform:translateX(-50%);color:rgb(255, 255, 255);font-size:clamp(7px,1.4vw,11px);font-weight:900;letter-spacing:1px;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="gr">
  <div id="tb">ANGRY MOAI<br><span id="sb">🗿 ISLE OF RAGE 🗿</span></div>
  <div id="cw">
    <canvas id="gc"></canvas>
    <div id="mo">
      <div id="mt">LEVEL CLEAR!</div>
      <div class="sub" id="ms"></div>
      <button id="rb" onclick="initGame()">PLAY AGAIN</button>
      <button id="nb" onclick="window.location.href='game1.html'">🗿 NEXT LEVEL →</button>
    </div>
    <div id="ah">DRAG MOAI TO AIM · RELEASE TO LAUNCH</div>
  </div>
  <div id="hud">
    <div><div class="hl">SCORE</div><div class="hv" id="sv">0</div></div>
    <div style="text-align:center"><div class="hl">MOAIS</div><div class="hv" id="mv">3</div></div>
    <div style="text-align:right"><div class="hl">PIGS</div><div class="hv" id="pv">3</div></div>
  </div>
</div>

<script>
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const mo=document.getElementById('mo'),mt=document.getElementById('mt'),ms=document.getElementById('ms');
const LW=680,LH=420;
canvas.width=LW;canvas.height=LH;
const GRAV=0.32,GND=LH-52,SX=90,SY=GND-65,PLIM=100,POW=0.26;
let moais,pigs,blocks,parts,score,drag,dX,dY,over,won;
let mVX=0,mVY=0,mX=SX,mY=SY,mA=false,mLeft=0,cool=0,animId;

function rnd(a,b){return a+Math.random()*(b-a);}

function initGame(){
  over=false;won=false;score=0;mA=false;drag=false;
  mVX=0;mVY=0;mX=SX;mY=SY;cool=0;parts=[];
  mo.style.display='none';
  mLeft=3;
  blocks=[
    {x:400,y:GND-60,w:16,h:60,hp:2,c:'#888'},{x:480,y:GND-60,w:16,h:60,hp:2,c:'#888'},
    {x:398,y:GND-78,w:100,h:18,hp:2,c:'#aaa'},{x:545,y:GND-60,w:16,h:60,hp:2,c:'#888'},
    {x:625,y:GND-60,w:16,h:60,hp:2,c:'#888'},{x:543,y:GND-78,w:100,h:18,hp:2,c:'#aaa'},
    {x:447,y:GND-105,w:14,h:44,hp:2,c:'#999'},{x:567,y:GND-105,w:14,h:44,hp:2,c:'#999'},
    {x:445,y:GND-108,w:150,h:14,hp:2,c:'#bbb'},
  ];
  pigs=[
    {x:440,y:GND-96,r:19,alive:true,dy:0},
    {x:510,y:GND-96,r:19,alive:true,dy:0},
    {x:582,y:GND-96,r:19,alive:true,dy:0},
  ];
  hud();cancelAnimationFrame(animId);loop();
}

function loop(){upd();draw();if(!over)animId=requestAnimationFrame(loop);else endGame();}

function upd(){
  cool=Math.max(0,cool-1);
  if(mA){
    mVY+=GRAV;mX+=mVX;mY+=mVY;colCheck();
    if(mY>GND+80||mX>LW+80||mX<-80){mA=false;}
  }
  for(let b of blocks){if(b.cr>0){b.cr--;if(b.cr<=0)b.gone=true;}}
  for(let p of pigs){if(p.dy>0){p.dy--;if(p.dy<=0)p.alive=false;}}
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;return p.life>0;});
  if(pigs.filter(p=>p.alive).length===0&&!over){over=true;won=true;}
  if(mLeft===0&&!mA&&pigs.filter(p=>p.alive).length>0&&!over){over=true;won=false;}
  hud();
}

function colCheck(){
  let r=22;
  for(let b of blocks){
    if(b.gone||b.cr)continue;
    if(mX+r>b.x&&mX-r<b.x+b.w&&mY+r>b.y&&mY-r<b.y+b.h){
      b.hp--;sp(mX,mY,'#aaa',8);
      if(b.hp<=0){b.cr=10;score+=50;}
      let mh=Math.min(mX+r-b.x,b.x+b.w-(mX-r)),mv=Math.min(mY+r-b.y,b.y+b.h-(mY-r));
      if(mh<mv)mVX*=-0.45;else mVY*=-0.45;
      mVX*=0.8;mVY*=0.8;
      if(Math.abs(mVX)+Math.abs(mVY)<1.5){mA=false;}
    }
  }
  for(let p of pigs){
    if(!p.alive||p.dy)continue;
    let dx=mX-p.x,dy=mY-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<r+p.r){
      p.dy=14;score+=200;
      sp(p.x,p.y,'#5a3',28);sp(p.x,p.y,'#FFD700',10);
      mVX*=0.5;mVY*=0.5;
    }
  }
  if(mY+r>=GND){
    mY=GND-r;mVY*=-0.28;mVX*=0.72;
    sp(mX,GND,'#FFD700',6);
    if(Math.abs(mVY)<1.2){mA=false;}
  }
}

function sp(x,y,c,n){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-5,5),vy:rnd(-6,0.5),col:c,life:rnd(20,38)|0,r:rnd(2,5.5)});
}

function draw(){
  ctx.clearRect(0,0,LW,LH);
  // Sky
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,LW,GND);
  ctx.fillStyle='#FFD700';
  for(let i=0;i<22;i++){ctx.beginPath();ctx.arc((i*71+13)%LW,(i*53+22)%(GND-40),1.2,0,Math.PI*2);ctx.fill();}
  // Ground
  ctx.fillStyle='#FFD700';ctx.fillRect(0,GND,LW,LH-GND);
  ctx.fillStyle='#111';ctx.fillRect(0,GND,LW,3);
  ctx.fillStyle='#c9a800';
  for(let i=0;i<LW;i+=38)ctx.fillRect(i,GND+4,20,6);
  // Power meter
  if(drag){
    let dx=dX-SX,dy=dY-SY,fr=Math.min(1,Math.sqrt(dx*dx+dy*dy)/PLIM);
    let bw=80,bh=10,bx=SX-40,by=SY-93;
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.beginPath();ctx.roundRect(bx-2,by-2,bw+4,bh+4,4);ctx.fill();
    ctx.fillStyle=fr<0.4?'#5f5':fr>0.75?'#f55':'#FFD700';
    ctx.beginPath();ctx.roundRect(bx,by,bw*fr,bh,3);ctx.fill();
    ctx.strokeStyle='#FFD700';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';
    ctx.fillText('POWER',bx+bw/2,by-4);ctx.textAlign='left';
  }
  // Slingshot
  ctx.save();
  ctx.strokeStyle='#8B5E3C';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(SX-12,SY+14);ctx.lineTo(SX-16,SY-36);ctx.stroke();
  ctx.beginPath();ctx.moveTo(SX+12,SY+14);ctx.lineTo(SX+16,SY-36);ctx.stroke();
  ctx.strokeStyle='#4a2e0f';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(SX-10,SY+16);ctx.lineTo(SX,SY+28);ctx.lineTo(SX+10,SY+16);ctx.stroke();
  if(drag){
    ctx.strokeStyle='#FFD700';ctx.lineWidth=2.5;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(SX-14,SY-32);ctx.lineTo(dX,dY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(SX+14,SY-32);ctx.lineTo(dX,dY);ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle='rgba(255,215,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(SX-14,SY-32);ctx.lineTo(SX,SY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(SX+14,SY-32);ctx.lineTo(SX,SY);ctx.stroke();
  }
  ctx.restore();
  // Trajectory dots
  if(drag){
    let dx=SX-dX,dy=SY-dY,spd=Math.sqrt(dx*dx+dy*dy);
    let vx=dx*POW,vy=dy*POW-spd*0.012,tx=SX,ty=SY;
    for(let i=0;i<28;i++){
      vy+=GRAV;tx+=vx;ty+=vy;
      if(i%2===0){ctx.globalAlpha=1-(i/28)*0.7;ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(tx,ty,3,0,Math.PI*2);ctx.fill();}
      if(ty>GND)break;
    }
    ctx.globalAlpha=1;
  }
  // Blocks
  for(let b of blocks){
    if(b.gone)continue;
    ctx.globalAlpha=b.cr?(b.cr/10):1;
    ctx.fillStyle=b.hp<=1?'#666':b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#FFD700';ctx.lineWidth=1;ctx.strokeRect(b.x,b.y,b.w,b.h);
    if(b.hp<=1){
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(b.x+4,b.y+4);ctx.lineTo(b.x+b.w-4,b.y+b.h-4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.x+b.w-4,b.y+4);ctx.lineTo(b.x+4,b.y+b.h-4);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // Pigs
  for(let p of pigs){
    if(!p.alive)continue;
    let sc=p.dy>0?(p.dy/14):1;
    ctx.globalAlpha=sc;ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);
    ctx.fillStyle='#5ab82e';ctx.strokeStyle='#222';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7fd44e';ctx.beginPath();ctx.arc(-p.r*.2,-p.r*.15,p.r*.35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(-p.r*.32,-p.r*.18,p.r*.18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.r*.32,-p.r*.18,p.r*.18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-p.r*.26,-p.r*.22,p.r*.07,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.r*.38,-p.r*.22,p.r*.07,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2d5e10';ctx.beginPath();ctx.arc(0,p.r*.12,p.r*.28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(0,p.r*.12,p.r*.28,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,p.r*.45,p.r*.28,.1,Math.PI-.1);ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
  // Particles
  for(let p of parts){
    ctx.globalAlpha=p.life/36;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Active moai / bullet
  let mx,my,ang=0;
  if(mA){mx=mX;my=mY;ang=Math.atan2(mVY,mVX);drawMoai(ctx,mx,my,22,ang);}
  else if(drag){drawMoai(ctx,dX,dY,22,0);}
  else if(mLeft>0){drawMoai(ctx,SX,SY,22,0);}
  // Queue moais waiting
  for(let i=0;i<mLeft-(mA||drag?0:1);i++){
    drawMoai(ctx,SX-50-(i*46),SY+10,16,0);
  }
}

function drawMoai(c,x,y,r,angle){
  c.save();c.translate(x,y);c.rotate(angle*0.12);
  let h=r*2.5,w=r*1.5;
  c.fillStyle='#e8e0d0';c.strokeStyle='#222';c.lineWidth=1.5;
  c.beginPath();c.roundRect(-w/2,-h*.55,w,h,[r*.3,r*.3,r*.18,r*.18]);c.fill();c.stroke();
  c.fillStyle='#d0c8ba';c.fillRect(-w/2+2,-h*.06,w-4,h*.38);
  c.fillStyle='#c0b8ae';c.fillRect(-w/2+4,h*.02,w-8,h*.28);
  let ey=-h*.18;
  c.fillStyle='#222';
  c.beginPath();c.ellipse(-w*.24,ey,r*.23,r*.16,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(w*.24,ey,r*.23,r*.16,0,0,Math.PI*2);c.fill();
  c.strokeStyle='#222';c.lineWidth=1.4;
  c.beginPath();c.moveTo(-w*.34,ey-r*.22);c.lineTo(-w*.12,ey-r*.08);c.stroke();
  c.beginPath();c.moveTo(w*.34,ey-r*.22);c.lineTo(w*.12,ey-r*.08);c.stroke();
  c.strokeStyle='#555';c.lineWidth=1.2;
  c.beginPath();c.moveTo(-w*.2,ey+r*.34);c.quadraticCurveTo(0,ey+r*.2,w*.2,ey+r*.34);c.stroke();
  c.fillStyle='#c8c0b0';c.fillRect(-w*.14,-h*.55,w*.28,r*.3);
  c.restore();
}

function hud(){
  document.getElementById('sv').textContent=score;
  document.getElementById('mv').textContent=mLeft+(mA?1:0);
  document.getElementById('pv').textContent=pigs.filter(p=>p.alive).length;
}

function endGame(){
  mo.style.display='block';
  mt.textContent=won?'LEVEL CLEAR!':'GAME OVER!';
  ms.textContent=won?`Score: ${score} pts — All pigs gone!`:`Pigs survived! Score: ${score}`;
  mo.querySelector('#rb').style.pointerEvents='all';
  document.getElementById('nb').style.display=won?'block':'none';
  document.getElementById('nb').style.pointerEvents=won?'all':'none';
}

function gp(e){
  let rc=canvas.getBoundingClientRect(),sx=LW/rc.width,sy=LH/rc.height;
  if(e.touches)return{x:(e.touches[0].clientX-rc.left)*sx,y:(e.touches[0].clientY-rc.top)*sy};
  return{x:(e.clientX-rc.left)*sx,y:(e.clientY-rc.top)*sy};
}
function onDown(e){
  e.preventDefault();if(over||mA||cool>0||mLeft<=0)return;
  let{x,y}=gp(e);
  if(Math.sqrt((x-SX)**2+(y-SY)**2)<58){drag=true;dX=SX;dY=SY;}
}
function onMove(e){
  e.preventDefault();if(!drag)return;
  let{x,y}=gp(e),dx=x-SX,dy=y-SY,d=Math.sqrt(dx*dx+dy*dy);
  if(d>PLIM){let f=PLIM/d;dx*=f;dy*=f;}
  dX=SX+dx;dY=SY+dy;
}
function onUp(e){
  e.preventDefault();if(!drag)return;drag=false;
  let dx=SX-dX,dy=SY-dY,spd=Math.sqrt(dx*dx+dy*dy);
  if(spd<10){mX=SX;mY=SY;return;}
  if(mLeft<=0)return;
  mLeft--;
  mX=dX;mY=dY;mVX=dx*POW;mVY=dy*POW-spd*0.014;mA=true;cool=45;
}
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});
initGame();
</script>
</body>
</html>
